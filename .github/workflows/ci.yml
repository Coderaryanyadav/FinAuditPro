name: FinAuditPro CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python Package & Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ocr,ai]
          pip install pytest pytest-cov ruff mypy httpx

      - name: Run Ruff Linter
        run: |
          ruff check src tests scripts

      - name: Run MyPy Strict Type Checker
        run: |
          mypy src/finauditpro

      - name: Run Pytest Test Suite & Code Coverage
        run: |
          pytest -v --cov=src/finauditpro tests

      - name: Run Automated Diagnostic Environment Probe
        run: |
          python scripts/development/automated_system_check.py

      - name: Run Master 1,000-Point Forensic Runner
        run: |
          python scripts/development/run_1000_verifications.py
