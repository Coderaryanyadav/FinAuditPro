[project]
name = "finauditpro"
version = "0.1.0"
description = "Offline-first audit intelligence workspace for Indian audit practice"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Runtime dependencies only. Anything needed purely for development belongs in
# [dependency-groups].dev — an auditor's workstation must not pull test runners.
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Heavy, optional subsystems. Deliberately not installed by default so the core
# workspace stays usable on a modest machine. Wired up in later milestones.
ocr = ["pymupdf>=1.24", "pillow>=10.3"]
ai = ["httpx>=0.27"]

[project.scripts]
finauditpro = "finauditpro.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finauditpro"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["_reference", ".venv-legacy-ocr", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "S",        # bandit security checks
    "DTZ",      # timezone-aware datetimes
    "TID",      # tidy imports
]
ignore = [
    "E501",     # line length is handled by the formatter
    "E701",     # multiple statements on one line (colon)
    "E702",     # multiple statements on one line (semicolon)
    "E741",     # single letter variable names in list comprehensions
    "E402",     # module level imports
    "RUF001",   # ambiguous characters in UI strings (symbols like ₹, ×, ⌘)
    "RUF002",   # docstring ambiguous characters
    "RUF003",   # comment ambiguous characters
    "RUF046",   # unnecessary cast to int
    "S110",     # try-except-pass in UI fallbacks
    "SIM108",   # ternary operator preference
    "DTZ007",   # naive strptime in date parsing fallback
]


[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts, hardcoded sample credentials, and fixture unpacking.
"tests/**" = ["S101", "S105", "S106", "F841", "RUF059", "PTH123", "PTH110"]


[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The domain layer must stay pure. Enforced structurally by tests/test_architecture.py;
# this is a second line of defence for obviously wrong imports.
"datetime.datetime.utcnow".msg = "Naive UTC is ambiguous. Use finauditpro.clock.utc_now()."

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "gui: requires a Qt application instance",
]
filterwarnings = ["error::DeprecationWarning:finauditpro.*"]

[tool.mypy]
python_version = "3.12"
files = ["src/finauditpro"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Qt and external C/heavy library stubs are incomplete; don't let that block strictness elsewhere.
module = ["PySide6.*", "reportlab.*", "openpyxl.*", "faiss.*", "fitz.*", "PIL.*", "dateutil.*", "pytesseract.*", "pypdfium2.*", "pdfplumber.*"]
ignore_missing_imports = true
follow_imports = "skip"



[tool.coverage.run]
source = ["src/finauditpro"]
omit = ["*/ui/*"]

