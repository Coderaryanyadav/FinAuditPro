name: FinAuditPro Security & Vulnerability Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1' # Weekly scan

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ocr,ai]
          pip install ruff bandit pip-audit

      - name: Run Ruff Security & Static Analysis
        run: |
          ruff check src/ tests/ scripts/

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r src/finauditpro -ll -ii

      - name: Secret & Fallback Constant Scan
        run: |
          python scripts/packaging/verify_release.py --pre-build
