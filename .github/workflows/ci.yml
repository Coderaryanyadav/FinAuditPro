name: FinAuditPro CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          brew install tesseract

      - name: Install Python Package & Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ocr,ai]
          pip install pytest pytest-cov ruff mypy

      - name: Run Ruff Code Formatter & Linter
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run MyPy Type Checker
        run: |
          mypy src/finauditpro

      - name: Run AST Architecture & Unit Test Suite
        run: |
          pytest -v --cov=src/finauditpro tests
